# dsh-plugin-session-palette-probe — bundle layer.
#
# Throwaway Phase 0 probe. The row id is what the client half's slot cell and
# locale namespace are keyed to, so it must stay `session-palette-probe`.
#
# It contributes one `shell.overlay` entry, so it needs no configuration: the
# diagnostics panel is driven entirely from live client state. To remove the
# probe, uninstall this bundle.
- insert:
    - id: session-palette-probe
      name: 'dsh-plugin-session-palette-probe'
